<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="style.css"/>
    <title>panda cart</title>
</head>
<body>
    <!-- header -->

    <!-- main -->
    <main>
        <div class="main-left">
            <div id="products-list">
                <!-- ----------------------product cart elem -->
                <div class="procut">
                    <div class="image-box">
                        <img src="./images/morad.png" alt="#83726" />
                    </div>

                    <div class="product-content">
                        <div>
                            <h2>product name</h2>
                            <p>300$</p>
                        </div>
                        <div class="btn-box">
                            <button>-</button>
                            <span class="product-cunt">1</span>
                            <button>+</button>
                        </div>
                    </div>
                </div>


            </div>
            <div class="product-info">
                <h4 id="offer">50%</h4>
                <h3 id="total-price">1200$</h3>
            </div>
        </div>

        <div class="main-right">
            <div>
                <p class="rules">Lorem ipsum dolor sit amet consectetur adipisicing elit. Cupiditate sit optio similique fugiat ipsa rem alias deleniti earum facilis aspernatur!</p>
            <label style="cursor:pointer ;">پذیرش قوانین <input type="checkbox"/></label>
            </div>

            <input type="text" maxlength="10" placeholder="کد تخفیف"/>
            <button id="payment">پرداخت</button>
        </div>
    </main>
    <!-- footer -->

    <!-- scripts -->
    <script src="./app.js" defer></script>
</body>
</html>
